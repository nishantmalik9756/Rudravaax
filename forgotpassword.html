<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; margin: 0; padding: 20px; display: grid;
      place-items: center; background: #000; color: #fff;
      font-family: Arial, sans-serif; color-scheme: dark;
    }
    main {
      width: min(100%, 430px); padding: 30px; border: 1px solid #292929;
      border-radius: 16px; background: #080808;
    }
    h1 { margin: 0 0 8px; }
    p { color: #aaa; line-height: 1.5; }
    label { display: block; margin: 16px 0 7px; font-size: 14px; }
    input {
      width: 100%; padding: 12px; border: 1px solid #333; border-radius: 8px;
      background: #101010; color: #fff; font: inherit;
    }
    input:focus { outline: 1px solid #aaa; }
    button {
      width: 100%; margin-top: 20px; padding: 13px; border: 0;
      border-radius: 8px; background: #fff; color: #000;
      cursor: pointer; font-weight: 700;
    }
    button:disabled { opacity: .6; cursor: wait; }
    a { color: #fff; }
    #message { white-space: pre-wrap; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Forgot password?</h1>
    <p id="description">Enter your account email and we’ll send you a password reset link.</p>

    <form id="request-form">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" required>
      <button id="send-button" type="submit">Send reset link</button>
    </form>

    <form id="update-form" hidden>
      <label for="new-password">New password</label>
      <input id="new-password" type="password" minlength="8"
             autocomplete="new-password" required>

      <label for="repeat-password">Re-enter new password</label>
      <input id="repeat-password" type="password" minlength="8"
             autocomplete="new-password" required>

      <button id="update-button" type="submit">Update password</button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>
    <p><a href="login.html">Back to login</a></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://mirxupauzfprafnestmq.supabase.co";
    const SUPABASE_PUBLIC_KEY = "sb_publishable_37Z1dMQkgE9I2dOD-7aQjg_8t4rj9Vl";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLIC_KEY);
    const $ = (id) => document.getElementById(id);

    async function preparePage() {
      // Supabase processes the recovery link and establishes a temporary session.
      const { data, error } = await supabase.auth.getSession();

      if (error) {
        $("message").textContent = error.message;
        return;
      }

      const hasRecoverySession = Boolean(data.session) &&
        (location.hash.includes("type=recovery") ||
         new URLSearchParams(location.search).has("code"));

      if (hasRecoverySession) {
        $("request-form").hidden = true;
        $("update-form").hidden = false;
        $("title").textContent = "Choose a new password";
        $("description").textContent = "Enter and confirm your new password.";
      }
    }

    preparePage();

    $("request-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      $("message").textContent = "";

      const redirectTo = new URL("forgotpassword.html", location.href).href;
      const { error } = await supabase.auth.resetPasswordForEmail(
        $("email").value.trim(),
        { redirectTo }
      );

      $("message").textContent = error
        ? error.message
        : "If an account exists for that email, a password reset link has been sent.";
    });

    $("update-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      $("message").textContent = "";

      const password = $("new-password").value;
      if (password !== $("repeat-password").value) {
        $("message").textContent = "The passwords do not match.";
        return;
      }

      const button = $("update-button");
      button.disabled = true;

      const { error } = await supabase.auth.updateUser({ password });

      if (error) {
        $("message").textContent = error.message;
      } else {
        await supabase.auth.signOut();
        $("message").textContent = "Password updated. You can now log in.";
        $("update-form").hidden = true;
      }

      button.disabled = false;
    });
  </script>
</body>
</html>
