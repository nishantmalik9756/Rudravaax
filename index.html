
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">

    <title>RudraVX Play</title>

    
 <meta name="description"
        content="Explore Rudravaax, his music, upcoming projects, team and the RudraVX music ecosystem.">


    <link rel="manifest" href="./manifest.json">

    <meta name="theme-color" content="#10141c">

    <meta name="mobile-web-app-capable" content="yes">

    <link rel="icon" href="./images/logo0.jpeg">

    <link rel="apple-touch-icon" href="./icons/icon-192.png">
    <link rel="stylesheet" href="main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">


    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="main.css">
</head>

<body>

    <!-- HEADER -->
    <header class="player-header">

        <a href="main.html" class="logo">
            <img src="images/logo0.jpeg" alt="RudraVX">
        </a>
 <a href="main.html" class="active">Enter The RudraVX Universe</a>
        <h1>RudraVX Play</h1>

    </header>


    <!-- MAIN MUSIC LIBRARY -->
    <main class="music-container" id="mainMusicPage">

        <!-- SEARCH -->
        <section class="search-section">

            <input
                type="search"
                id="songSearch"
                placeholder="Search songs, albums, artists..."
                autocomplete="off"
            >

        </section>


        <!-- SINGLES -->
        <section class="music-section" id="singlesSection">

            <h2>Singles</h2>

            <div class="music-grid" id="singlesContainer"></div>

        </section>


        <!-- EPS -->
        <section class="music-section" id="epsSection">

            <h2>EPs</h2>

            <div class="music-grid" id="epsContainer"></div>

        </section>


        <!-- ALBUMS -->
        <section class="music-section" id="albumsSection">

            <h2>Albums</h2>

            <div class="music-grid" id="albumsContainer"></div>

        </section>


        <!-- ARTISTS -->
        <section class="music-section" id="artistsSection">

            <h2>RudraVX Artists</h2>

            <div class="artist-grid" id="artistsContainer"></div>

        </section>


        <!-- SEARCH RESULTS -->
        <section
            class="music-section"
            id="searchResultsSection"
            hidden
        >

            <h2>Search Results</h2>

            <div class="music-grid" id="searchResults"></div>

        </section>

    </main>


    <!-- ARTIST PROFILE -->
    <section
        class="album-section artist-profile-section"
        id="artistSection"
        hidden
    >

        <button id="closeArtist" type="button">
            ← Back
        </button>

        <div id="artistDetails"></div>

        <h2>All Songs</h2>

        <div id="artistTracks"></div>

    </section>


    <!-- ALBUM / EP DETAILS -->
    <section
        class="album-section"
        id="albumSection"
        hidden
    >

        <button id="closeAlbum" type="button">
            ← Back
        </button>

        <div id="albumDetails"></div>

        <div id="albumTracks"></div>

    </section>


    <!-- =================================
         APPLE MUSIC STYLE PLAYER
    ================================== -->

    <footer class="bottom-player" id="bottomPlayer">

        <!-- CURRENT SONG -->
        <div class="current-song">

            <img
                id="currentCover"
                src="images/logo.jpeg"
                alt="Song Cover"
            >

            <div class="song-meta">

                <h3 id="currentTitle">
                    Select a Song
                </h3>

                <p id="currentArtist">
                    Rudravaax
                </p>

            </div>

        </div>


        <!-- PLAYER CONTROLS -->
        <div class="player-controls">

            <div class="control-buttons">

                <!-- SHUFFLE -->
                <button
                    id="shuffleBtn"
                    type="button"
                    aria-label="Shuffle"
                    title="Shuffle"
                >
                    ⤨
                </button>


                <!-- PREVIOUS -->
                <button
                    id="previousBtn"
                    type="button"
                    aria-label="Previous Song"
                    title="Previous"
                >
                    ◀◀
                </button>


                <!-- PLAY / PAUSE -->
                <button
                    id="playPauseBtn"
                    class="main-play-btn"
                    type="button"
                    aria-label="Play"
                    title="Play / Pause"
                >
                    ▶
                </button>


                <!-- NEXT -->
                <button
                    id="nextBtn"
                    type="button"
                    aria-label="Next Song"
                    title="Next"
                >
                    ▶▶
                </button>


                <!-- REPEAT -->
                <button
                    id="repeatBtn"
                    type="button"
                    aria-label="Repeat"
                    title="Repeat"
                >
                    ⟳
                </button>

            </div>


            <!-- SONG PROGRESS -->
            <div class="progress-container">

                <span id="currentTime">
                    0:00
                </span>

                <input
                    type="range"
                    id="progressBar"
                    min="0"
                    max="100"
                    value="0"
                    step="0.1"
                    aria-label="Song Progress"
                >

                <span id="duration">
                    0:00
                </span>

            </div>

        </div>


        <!-- VOLUME CONTROL -->
        <div class="volume-control">

            <span aria-hidden="true">◖</span>

            <input
                type="range"
                id="volumeBar"
                min="0"
                max="1"
                step="0.01"
                value="1"
                aria-label="Volume"
            >

        </div>

    </footer>


    <!-- AUDIO ELEMENT -->
    <audio
        id="audioPlayer"
        preload="metadata"
    ></audio>


    <!-- JAVASCRIPT FILES -->
    <script src="songs.js"></script>
    <script src="player.js"></script>
    <script src="artists.js"></script>


  
      
</body>

</html>
